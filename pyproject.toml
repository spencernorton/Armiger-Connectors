[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "armiger-connectors"
version = "1.2.2"
description = "Turnkey connectors integrating Armiger and Armiger Ultra with Bitmagnet, Rats Search, and the *Arr Stack."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "bitmagnet", "rats-search", "arr-stack"]

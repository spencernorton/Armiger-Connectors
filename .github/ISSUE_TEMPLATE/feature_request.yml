name: Feature request
description: Propose an enhancement to Armiger models, plugins, or SDK
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What classification, safety, or DHT synchronization problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the proposed API, feature, or invariant.
    validations:
      required: true

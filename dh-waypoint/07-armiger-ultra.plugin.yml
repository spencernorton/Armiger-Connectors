# Drop this file into DH_WAYPOINT_PROCESSORS_PLUGIN_DIR (default /etc/dh-waypoint/plugins.d).
#
# Full Armiger Ultra integration wiring:
#   1. Batch classification (`POST /v1/classify`, `dh-waypoint.processor.v1`)
#   2. Cohort admission gate (`POST /v1/admit`, `dh-waypoint.processors.admission.v1`)
#   3. 4-tier closed-loop outcome feedback (`POST /v1/feedback`, `dh-waypoint.processors.feedback.v1`)

processor:
  name: armiger-ultra
  endpoint: http://armiger-ultra:8095/v1/classify
  timeout: 5s
  max_batch: 64
  required: false
  forward_files: true
  max_files: 64
  forward_trackers: true
  forward_swarm: true

admission:
  enabled: true
  endpoint: http://armiger-ultra:8095/v1/admit
  timeout: 3s
  max_batch: 64
  max_files: 64
  fail_open: true

learning:
  enabled: true
  feedback_endpoint: http://armiger-ultra:8095/v1/feedback
  feedback_timeout: 5s
  feedback_batch_size: 64
  flush_interval: 15s
  queue_size: 2048

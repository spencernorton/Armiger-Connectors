services:
  armiger-torznab-proxy:
    image: python:3.12-slim
    container_name: armiger-torznab-proxy
    restart: unless-stopped
    working_dir: /var/lib/armiger
    ports:
      - "${ARMIGER_PROXY_PORT:-8097}:8097"
    environment:
      ARMIGER_MODEL_DIR: /var/lib/armiger/model
      ARMIGER_HF_REPO: "${ARMIGER_HF_REPO:-NorviTech/armiger-ultra}"
      ARMIGER_AUTO_DOWNLOAD: "${ARMIGER_AUTO_DOWNLOAD:-true}"
      ARMIGER_VARIANT: "${ARMIGER_VARIANT:-fp32}"
      UPSTREAM_TORZNAB_URL: "${UPSTREAM_TORZNAB_URL:-http://prowlarr:9696/1/api}"
      ARMIGER_PROXY_HOST: "0.0.0.0"
      ARMIGER_PROXY_PORT: "8097"
      ARMIGER_REQUIRE_ENGLISH_AUDIO: "${ARMIGER_REQUIRE_ENGLISH_AUDIO:-false}"
      ARMIGER_ALLOW_ENGLISH_SUBS: "${ARMIGER_ALLOW_ENGLISH_SUBS:-true}"
      ARMIGER_REJECT_DEAD_SWARMS: "${ARMIGER_REJECT_DEAD_SWARMS:-true}"
      ARMIGER_USE_ZERO_CUE_CATALOG: "${ARMIGER_USE_ZERO_CUE_CATALOG:-true}"
    volumes:
      - armiger_data:/var/lib/armiger
    command:
      - /bin/sh
      - -c
      - |
        set -e
        pip install --no-cache-dir --quiet numpy onnxruntime cryptography huggingface_hub
        pip install --no-cache-dir --quiet --index-url https://download.pytorch.org/whl/cpu torch || true
        python3 -c '
        import os, urllib.request
        from pathlib import Path
        from huggingface_hub import snapshot_download
        base = "https://raw.githubusercontent.com/spencernorton/Armiger-Connectors/main"
        for sub, fn in (("bitmagnet", "bitmagnet_connector.py"), ("arr-stack", "armiger_torznab_proxy.py")):
            dst = Path("/var/lib/armiger") / sub / fn
            dst.parent.mkdir(parents=True, exist_ok=True)
            if not dst.is_file():
                urllib.request.urlretrieve(f"{base}/{sub}/{fn}", str(dst))
        model_dir = Path(os.environ.get("ARMIGER_MODEL_DIR", "/var/lib/armiger/model"))
        if not (model_dir / "armiger_onnx.py").is_file():
            model_dir.mkdir(parents=True, exist_ok=True)
            snapshot_download(repo_id=os.environ.get("ARMIGER_HF_REPO", "NorviTech/armiger-ultra"), local_dir=str(model_dir))
        '
        exec python3 /var/lib/armiger/arr-stack/armiger_torznab_proxy.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  armiger-arr-webhook-receiver:
    image: python:3.12-slim
    container_name: armiger-arr-webhook-receiver
    restart: unless-stopped
    working_dir: /var/lib/armiger
    ports:
      - "${ARMIGER_WEBHOOK_PORT:-8098}:8098"
    environment:
      ARMIGER_MODEL_DIR: /var/lib/armiger/model
      ARMIGER_HF_REPO: "${ARMIGER_HF_REPO:-NorviTech/armiger-ultra}"
      ARMIGER_AUTO_DOWNLOAD: "${ARMIGER_AUTO_DOWNLOAD:-true}"
      ARMIGER_VARIANT: "${ARMIGER_VARIANT:-int8}"
      ARMIGER_WEBHOOK_HOST: "0.0.0.0"
      ARMIGER_WEBHOOK_PORT: "8098"
      ARMIGER_RUN_FFPROBE: "${ARMIGER_RUN_FFPROBE:-true}"
      ARMIGER_DHT_RSI_MODE: "${ARMIGER_DHT_RSI_MODE:-pull_only}"
    volumes:
      - armiger_data:/var/lib/armiger
      - media_library:/data/media:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apt-get update && apt-get install -y --no-install-recommends ffmpeg && rm -rf /var/lib/apt/lists/*
        pip install --no-cache-dir --quiet numpy onnxruntime cryptography huggingface_hub
        pip install --no-cache-dir --quiet --index-url https://download.pytorch.org/whl/cpu torch || true
        python3 -c '
        import os, urllib.request
        from pathlib import Path
        from huggingface_hub import snapshot_download
        base = "https://raw.githubusercontent.com/spencernorton/Armiger-Connectors/main"
        for sub, fn in (("bitmagnet", "bitmagnet_connector.py"), ("arr-stack", "armiger_arr_webhook_receiver.py")):
            dst = Path("/var/lib/armiger") / sub / fn
            dst.parent.mkdir(parents=True, exist_ok=True)
            if not dst.is_file():
                urllib.request.urlretrieve(f"{base}/{sub}/{fn}", str(dst))
        model_dir = Path(os.environ.get("ARMIGER_MODEL_DIR", "/var/lib/armiger/model"))
        if not (model_dir / "armiger_onnx.py").is_file():
            model_dir.mkdir(parents=True, exist_ok=True)
            snapshot_download(repo_id=os.environ.get("ARMIGER_HF_REPO", "NorviTech/armiger-ultra"), local_dir=str(model_dir))
        '
        exec python3 /var/lib/armiger/arr-stack/armiger_arr_webhook_receiver.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  armiger_data:
  media_library:
